name: CI

# GitHub-flow: feature branches PR into main. This workflow validates every
# PR, every push to main, and every push to a releases/** branch; nothing
# here ever needs AWS credentials — it only builds and scans, it never
# pushes an image anywhere. That happens in cd.yml (main -> commit-SHA
# tag) and cd-staging.yml (releases/** -> vX.Y.Z-<sha> staging tag), both of which only
# run after this workflow succeeds on the matching branch (see their
# `workflow_run` triggers) — deploy never runs un-gated by CI.
# cd-release.yml (GitHub Release published) is the exception: it's a
# distinct, explicit event with no fixed relationship to a prior push
# here, so it runs its own build/test/scan inline instead of depending on
# this workflow.
#
# Scoped to app/** so a GitOps-only commit (cd.yml/cd-release.yml updating
# argocd-params.env) doesn't retrigger this and, transitively, those
# workflows themselves — see cd.yml's own comment for the rest of that
# loop-prevention.
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, "releases/**"]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  IMAGE_NAME: hivemind-greeter

jobs:
  lint-and-test:
    name: Lint, vet, test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum in app/ — greeter.go has zero non-stdlib dependencies,
          # so there's nothing for setup-go's module cache to key off of.
          cache: false

      - name: gofmt check
        run: |
          # gofmt -l lists files that aren't formatted; fail if it finds any.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o /dev/null ./...

      - name: go test
        run: go test ./... -v

  build-and-scan:
    name: Build image and scan for vulnerabilities
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      security-events: write # to upload the Trivy SARIF report
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed — CI never touches the registry)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Fails the job on any CRITICAL/HIGH finding — a PR with a
          # known-vulnerable base image or dependency shouldn't merge
          # silently.
          exit-code: "1"
          ignore-unfixed: true
          # Without this, trivy-action's entrypoint.sh silently drops the
          # `severity` filter above for sarif output (so the Security tab
          # sees every finding) but leaves exit-code checking against that
          # unfiltered report — so the job fails on any UNKNOWN/LOW/MEDIUM
          # finding too. Confirmed live: an UNKNOWN-severity, already-fixed
          # tzdata advisory failed this job despite the CRITICAL,HIGH filter.
          limit-severities-for-sarif: true

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
